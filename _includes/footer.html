<footer class="colophon">
  <div class="wrap">
    <div class="foot">
      <p class="motto"><span class="la" lang="la">{{ site.tagline | capitalize }}</span>{% if site.tagline_gloss %}<span class="gloss">{{ site.tagline_gloss }}</span>{% endif %}</p>
      <p class="foot-meta">© {{ 'now' | date: "%Y" }} {{ site.author.name }}
        {%- if site.email and site.email != "" %}<span class="s">·</span><a href="mailto:{{ site.email }}">Email</a>{% endif -%}
        <span class="s">·</span><a href="https://github.com/{{ site.social.github }}" rel="me noopener" target="_blank">GitHub</a>
        {%- if site.twitter.username %}<span class="s">·</span><a href="https://x.com/{{ site.twitter.username }}" rel="me noopener" target="_blank">X</a>{% endif -%}
        <span class="s">·</span><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </div>
</footer>
