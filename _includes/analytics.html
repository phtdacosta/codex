{%- if jekyll.environment == "production" and site.google_analytics -%}
<script>
/* Google Analytics. The page view is queued now; the script itself loads once the page has
   finished loading, so it never competes with the text and images. */
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{ site.google_analytics }}');
(function(){
  function load(){
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}';
    document.head.appendChild(s);
  }
  function later(){
    if (window.requestIdleCallback) requestIdleCallback(load, { timeout: 3000 });
    else setTimeout(load, 1);
  }
  if (document.readyState === 'complete') later();
  else window.addEventListener('load', later);
})();
</script>
{%- endif -%}
