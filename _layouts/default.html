<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
<!-- shared SVG defs: the duotone filter for plates, the lamp's halo gradient and ring path -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- luminance → lamp-black … bone, with the shadows lifted so dark plates still print -->
    <filter id="duotone" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.078 0.329 0.563 0.747 0.847 0.914"/>
        <feFuncG type="table" tableValues="0.071 0.316 0.544 0.723 0.821 0.886"/>
        <feFuncB type="table" tableValues="0.063 0.290 0.502 0.669 0.759 0.820"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="halo-g"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset=".6" stop-color="#e5502f" stop-opacity=".18"/><stop offset="1" stop-color="#e5502f" stop-opacity="0"/></radialGradient>
    <path id="ring-o" d="M32 6.8a25.2 25.2 0 1 1-.02 0"/>
  </defs>
</svg>
<a class="skip" href="#content">Skip to content</a>
{% include header.html %}
{% include lamp.html %}
<main id="content" class="wrap">
{{ content }}
</main>
{% include footer.html %}
{% include analytics.html %}
{% include kofi.html %}
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme-toggle');
  if(!btn) return;
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function current(){var a=root.getAttribute('data-theme');return a?a:(mq.matches?'dark':'light');}
  function sync(){
    btn.setAttribute('aria-pressed', current()==='dark');
    if(root.hasAttribute('data-theme')){
      var c=current()==='dark'?'#0f0e0d':'#e7e0cf';
      document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',c);});
    }
  }
  sync();
  btn.addEventListener('click',function(){
    root.setAttribute('data-theme', current()==='dark'?'light':'dark');
    try{localStorage.setItem('codex-theme', root.getAttribute('data-theme'));}catch(e){}
    sync();
  });
  if(mq.addEventListener) mq.addEventListener('change',sync);
})();
</script>
</body>
</html>
